name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  vitest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Cheapest gate first, so a type error fails in seconds rather than minutes.
      - run: pnpm typecheck
      - run: pnpm exec vitest run --reporter=json --outputFile=vitest-report.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: vitest-report, path: vitest-report.json }
      # Slowest gate last, and the only one that catches Server/Client boundary
      # mistakes — a browser API in a Server Component compiles and passes vitest,
      # then 500s in production. Needs no .env: every route is server-rendered on
      # demand, so nothing reads runtime config at build time.
      - run: pnpm build
